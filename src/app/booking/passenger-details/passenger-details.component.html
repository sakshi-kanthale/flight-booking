<div class="pd-wrapper">
  <div class="blob blob1"></div>
  <div class="blob blob2"></div>

  <div class="pd-card">
    <h2>Passenger Details</h2>

    <div *ngIf="errorMessage" class="alert alert-error">{{ errorMessage }}</div>
    <div *ngIf="loadingProfile" class="alert alert-info">Fetching your profile...</div>

    <form *ngIf="form" [formGroup]="form" (ngSubmit)="submit()">
      <div formArrayName="passengers">
        <div class="passenger-card" *ngFor="let p of passengers.controls; let i = index" [formGroupName]="i">
          <h3>Passenger {{ i + 1 }} — Seat {{ seats[i].seatNumber }}</h3>

          <label class="myself-toggle" *ngIf="i === 0">
            <input type="checkbox" [checked]="p.get('isMyself')?.value" (change)="onMyselfToggle(i, $any($event.target).checked)" />
            Booking for myself
          </label>

          <div class="field">
            <label>Full Name</label>
            <input type="text" formControlName="passengerName" placeholder="e.g. Riya Sharma" />
            <small class="error" *ngIf="p.get('passengerName')?.touched && p.get('passengerName')?.invalid">
              Enter a valid full name (2–60 characters).
            </small>
          </div>

          <div class="field-row">
            <div class="field">
              <label>Age</label>
              <input type="number" formControlName="passengerAge" placeholder="Age" />
              <small class="error" *ngIf="p.get('passengerAge')?.touched && p.get('passengerAge')?.invalid">
                Enter a valid age (1–120).
              </small>
            </div>

            <div class="field">
              <label>Gender</label>
              <select formControlName="passengerGender">
                <option value="" disabled>Select</option>
                <option value="MALE">Male</option>
                <option value="FEMALE">Female</option>
                <option value="OTHER">Other</option>
              </select>
              <small class="error" *ngIf="p.get('passengerGender')?.touched && p.get('passengerGender')?.invalid">
                Please select a gender.
              </small>
            </div>
          </div>

          <div class="field">
            <label>Passport Number</label>
            <input type="text" formControlName="passportNumber" placeholder="e.g. A1234569" />
            <small class="error" *ngIf="p.get('passportNumber')?.touched && p.get('passportNumber')?.invalid">
              6–12 letters/numbers, no spaces.
            </small>
          </div>
        </div>
      </div>

      <button type="submit" class="btn-primary" [disabled]="submitting">
        {{ submitting ? 'Creating booking...' : 'Continue to Payment' }}
      </button>
    </form>
  </div>
</div>
