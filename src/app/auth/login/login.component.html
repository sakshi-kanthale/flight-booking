<div class="login-wrapper">
  <div class="login-card">
    <h2>Welcome Back</h2>
    <p class="subtitle">Login to continue booking</p>

    <div *ngIf="errorMessage" class="alert alert-error">{{ errorMessage }}</div>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="field">
        <label>Email</label>
        <input type="email" formControlName="email" placeholder="you@example.com" />
        <small class="error" *ngIf="form.get('email')?.touched && form.get('email')?.invalid">
          Enter a valid email.
        </small>
      </div>

      <div class="field">
        <label>Password</label>
        <input type="password" formControlName="password" placeholder="Your password" />
        <small class="error" *ngIf="form.get('password')?.touched && form.get('password')?.invalid">
          Password is required.
        </small>
      </div>

      <button type="submit" class="btn-primary" [disabled]="submitting">
        {{ submitting ? 'Logging in...' : 'Login' }}
      </button>
    </form>

    <p class="switch-link">New here? <a routerLink="/register">Create an account</a></p>
  </div>
</div>
