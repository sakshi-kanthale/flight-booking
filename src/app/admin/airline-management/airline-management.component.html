<div class="admin-container">
  <h2>Airline Management</h2>

  <form #airlineForm="ngForm" (ngSubmit)="onSubmit(airlineForm)">
    <div class="form-row">
      <div class="form-input">
        <label for="airlineCode">Airline Code</label>
        <input
          type="text"
          id="airlineCode"
          name="airlineCode"
          [(ngModel)]="airlineData.airlineCode"
          #airlineCode="ngModel"
          placeholder="e.g. AI"
          required
          minlength="2"
          maxlength="3"
        />
        <small class="error" *ngIf="airlineCode.invalid && airlineCode.touched">
          Code must be 2-3 characters.
        </small>
      </div>

      <div class="form-input">
        <label for="airlineName">Airline Name</label>
        <input
          type="text"
          id="airlineName"
          name="airlineName"
          [(ngModel)]="airlineData.airlineName"
          #airlineName="ngModel"
          placeholder="e.g. Air India"
          required
        />
        <small class="error" *ngIf="airlineName.invalid && airlineName.touched">
          Airline name is required.
        </small>
      </div>
    </div>

    <button type="submit" [disabled]="airlineForm.invalid">
      {{ isEditing ? 'Update Airline' : 'Add Airline' }}
    </button>
    <button type="button" *ngIf="isEditing" (click)="cancelEdit()">Cancel</button>
  </form>

  <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>
  <p class="success" *ngIf="successMessage">{{ successMessage }}</p>

  <table class="admin-table" *ngIf="airlines.length > 0">
    <thead>
      <tr>
        <th>Code</th>
        <th>Name</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let airline of airlines">
        <td>{{ airline.airlineCode }}</td>
        <td>{{ airline.airlineName }}</td>
        <td>
          <button (click)="editAirline(airline)">Edit</button>
          <button (click)="deleteAirline(airline.airlineId)">Delete</button>
        </td>
      </tr>
    </tbody>
  </table>

  <p *ngIf="airlines.length === 0">No airlines added yet.</p>
</div>
